<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <title>Claude Suivi</title>
  <link rel="stylesheet" href="panneau.css">
</head>
<body>
  <header>
    <span id="mascotte-entete" class="mascotte-place"></span>
    <h1>Claude Suivi</h1>
    <button id="btn-tri" class="tri" title="Changer le tri des sessions" aria-label="Tri des sessions">⇅ <span id="tri-nom">État</span></button>
    <button id="btn-epingle" class="icone" title="Garder le panneau ouvert quand je clique ailleurs" aria-label="Garder le panneau ouvert" aria-pressed="false">📌</button>
    <button id="btn-grand" class="icone" title="Plein écran : voir plus de détails (Échap pour revenir)" aria-label="Plein écran" aria-pressed="false">⛶</button>
    <button id="btn-reglages" class="icone" title="Réglages" aria-label="Réglages" aria-expanded="false">⚙</button>
  </header>
  <section id="reglages" hidden>
    <label><input type="checkbox" id="opt-demarrage"> Lancer au démarrage de Windows</label>
    <label><input type="checkbox" id="opt-notifications"> Notifications Windows</label>
  </section>

  <main id="contenu">
    <section class="point">
      <h2>Le point</h2>
      <p id="point-texte" class="point-texte"></p>
      <p id="point-maj" class="discret"></p>
    </section>

    <nav class="barre-onglets" role="tablist">
      <button id="onglet-activite" class="onglet" role="tab" aria-selected="true" aria-controls="vue-activite">Activité <span id="nb-activite" class="nb"></span></button>
      <button id="onglet-todo" class="onglet" role="tab" aria-selected="false" aria-controls="vue-todo">To do <span id="nb-actions" class="nb"></span></button>
    </nav>

    <section id="vue-activite" role="tabpanel">
      <h2 class="titre-sessions">Sessions <button id="btn-nettoyer" class="nettoyer" title="Retire les cartes sans mise à jour depuis plus d'une heure">🧹 Nettoyer</button></h2>
      <div id="cartes"></div>
      <p id="vide" class="discret" hidden>Aucune session pour le moment.</p>
      <details id="termines" hidden>
        <summary>Terminés <span id="nb-termines" class="compteur"></span></summary>
        <div id="cartes-termines"></div>
      </details>
      <details id="journal" class="journal">
        <summary>Journal récent <span id="nb-journal" class="compteur"></span></summary>
        <ul id="activite" class="activite"></ul>
        <p id="activite-vide" class="discret">Rien de récent.</p>
      </details>
    </section>

    <section id="vue-todo" role="tabpanel" hidden>
      <h2>À faire traiter par Claude</h2>
      <div id="cartes-todo"></div>
      <p id="todo-vide" class="discret">Rien à faire dans la foulée.</p>
    </section>
  </main>

  <footer>
    <label for="notes">Bloc-notes</label>
    <textarea id="notes" rows="3" placeholder="Tes notes…" spellcheck="false"></textarea>
  </footer>
  <script src="panneau.js"></script>
</body>
</html>
